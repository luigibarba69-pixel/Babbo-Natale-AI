<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestione ordini | Magia di Natale AI</title><style>body{font:16px system-ui;background:#fff9ee;color:#21342d;margin:0}header{background:#103d34;color:white;padding:22px}main{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:white;border:1px solid #e5dfd5;border-radius:16px;padding:20px;margin:14px 0}input,button,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #b9c6bc}input{display:block;margin:12px 0;width:min(100%,420px)}button{background:#103d34;color:white;cursor:pointer}button:disabled{opacity:.6}article p{overflow-wrap:anywhere}a{color:inherit}.muted{color:#63746b}#orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}#orders article{margin:0}pre{white-space:pre-wrap;font-family:inherit}</style></head><body><header><h1>🎄 Gestione ordini</h1><a href="/">Torna al sito</a></header><main><section class="card" id="login"><h2>Accesso amministratore</h2><form id="loginForm"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button>Accedi</button></form></section><section id="dashboard" hidden><p><button id="refresh">Aggiorna ordini</button> <button id="logout">Esci</button></p><p class="muted">Ultime 100 richieste. I video si producono e si inviano manualmente dall'email del titolare.</p><div id="orders"></div></section><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
let client;const el=id=>document.getElementById(id);function msg(t){el('message').textContent=t}function escapeHtml(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function token(){const {data}=await client.auth.getSession();return data.session?.access_token}
async function load(){msg('Caricamento…');const r=await fetch('/api/admin-orders',{headers:{Authorization:'Bearer '+await token()}});const d=await r.json();if(!r.ok)throw Error(d.error||'Errore');el('orders').replaceChildren();for(const o of d.orders){const a=document.createElement('article');a.className='card';a.innerHTML='<strong>'+escapeHtml(o.child_name)+'</strong><p class="muted">'+escapeHtml(new Date(o.created_at).toLocaleString('it-IT'))+' · '+escapeHtml(o.package_type==='premium'?'Premium 14,99 €':'Base 9,90 €')+'</p><p>Email: <a href="mailto:'+encodeURIComponent(o.customer_email)+'">'+escapeHtml(o.customer_email)+'</a></p><p>Pronuncia: '+escapeHtml(o.name_pronunciation)+'</p><p>Hobby: '+escapeHtml(o.child_hobby)+'</p><p>Dedica: '+escapeHtml(o.dedication)+'</p><label>Stato <select><option value="new">Nuovo</option><option value="processing">In lavorazione</option><option value="completed">Pronto</option><option value="delivered">Consegnato</option></select></label>';const s=a.querySelector('select');s.value=o.status;s.onchange=async()=>{s.disabled=true;try{const r=await fetch('/api/admin-orders',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await token()},body:JSON.stringify({id:o.id,status:s.value})});if(!r.ok)throw Error((await r.json()).error);msg('Stato aggiornato')}catch(e){s.value=o.status;msg(e.message)}finally{s.disabled=false}};el('orders').append(a)}msg(d.orders.length+' richieste caricate')}
async function show(){const t=await token();el('login').hidden=!!t;el('dashboard').hidden=!t;if(t){try{await load()}catch(e){msg(e.message)}}}
(async()=>{try{const r=await fetch('/api/public-config');const c=await r.json();if(!c.url||!c.anonKey)throw Error('Configura SUPABASE_URL e SUPABASE_ANON_KEY su Vercel');client=supabase.createClient(c.url,c.anonKey);await show()}catch(e){msg(e.message)}})();
el('loginForm').onsubmit=async e=>{e.preventDefault();try{const {error}=await client.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(error)throw error;el('password').value='';await show()}catch(e){msg(e.message)}};el('logout').onclick=async()=>{await client.auth.signOut();await show()};el('refresh').onclick=()=>load().catch(e=>msg(e.message));
</script></body></html>
